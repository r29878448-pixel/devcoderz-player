<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderZ Video Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px}
.player-container{width:100%;max-width:900px;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.8);position:relative}
video{width:100%;height:auto;aspect-ratio:16/9;display:block;background:#000}
.loader-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;transition:opacity 0.3s ease}
.loader-overlay.hidden{opacity:0;visibility:hidden}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.2);border-top-color:#8B4513;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{margin-top:12px;font-size:14px;font-weight:600;color:#ddd}
.error-msg{padding:20px;text-align:center;color:#ff6b6b;font-size:14px;font-weight:600;display:none}
</style>
</head>
<body>

<div class="player-container">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">Loading Secure Stream...</div>
    </div>
    <div id="errorMsg" class="error-msg">Failed to load video stream. Please check parameters or connection.</div>
    <video id="videoPlayer" controls playsinline></video>
</div>

<script>
async function initPlayer() {
    const urlParams = new URLSearchParams(window.location.search);
    const batchId = urlParams.get('batchId');
    const childId = urlParams.get('childId');

    if (!batchId || !childId) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').innerText = 'Missing required URL parameters (batchId, childId)';
        return;
    }

    try {
        const mediaRes = await fetch(/api/video?batchId=${batchId}&childId=${childId});
        const mediaJson = await mediaRes.json();

        if (!mediaJson.success || !mediaJson.data) {
            throw new Error('Invalid media API response');
        }

        const rawUrl = mediaJson.data.url;
        const signed = mediaJson.data.signedUrl;
        const fullMpd = rawUrl + signed;

        const proxyUrl = /api/player?get_hls=1&quality=480&mpd=${encodeURIComponent(fullMpd)};
        const video = document.getElementById('videoPlayer');
        const loader = document.getElementById('loader');

        if (window.Hls && window.Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(proxyUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                loader.classList.add('hidden');
                video.play().catch(() => {});
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    loader.classList.add('hidden');
                    document.getElementById('errorMsg').style.display = 'block';
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = proxyUrl;
            video.addEventListener('loadedmetadata', () => {
                loader.classList.add('hidden');
                video.play().catch(() => {});
            });
        } else {
            loader.classList.add('hidden');
            document.getElementById('errorMsg').style.display = 'block';
        }
    } catch (err) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'block';
    }
}

initPlayer();
</script>

</body>
</html>
