<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Shaka Player Debugger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #status-box {
            color: #00ffcc;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
            max-width: 800px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="videoPlayer" controls autoplay></video>
        <div id="status-box">Initializing player system...</div>
    </div>

    <script>
        const statusBox = document.getElementById('status-box');

        function updateStatus(message, isError = false) {
            console.log(message);
            statusBox.style.color = isError ? '#ff4444' : '#00ffcc';
            statusBox.innerText = message;
        }

        async function initApp() {
            try {
                updateStatus('Step 1: Installing Shaka polyfills...');
                shaka.polyfill.installAll();

                if (!shaka.Player.isBrowserSupported()) {
                    updateStatus('Error: Browser is not supported by Shaka Player!', true);
                    return;
                }

                updateStatus('Step 2: Reading URL parameters...');
                const urlParams = new URLSearchParams(window.location.search);
                const batchId = urlParams.get('batchId');
                const subjectId = urlParams.get('subjectId');
                const scheduleId = urlParams.get('scheduleId');

                if (!batchId || !subjectId || !scheduleId) {
                    updateStatus(`Error: Missing parameters! Received -> batchId: ${batchId}, subjectId: ${subjectId}, scheduleId: ${scheduleId}`, true);
                    return;
                }

                updateStatus('Step 3: Building API URL and fetching data...');
                const timestamp = new Date().getTime();
                const apiUrl = `https://brainboxinstitute.in/api/video-url?batchId=${batchId}&subjectId=${subjectId}&scheduleId=${scheduleId}&t=${timestamp}`;

                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`API Fetch Failed! HTTP Status: ${response.status} (${response.statusText})`);
                }

                const data = await response.json();
                updateStatus('Step 4: API Response received successfully. Validating data structure...');

                if (!data.success) {
                    throw new Error('API returned success: false. The request might be unauthorized or expired.');
                }

                if (!data.video_data) {
                    throw new Error('API response does not contain "video_data" object.');
                }

                const rawManifestUrl = data.video_data.url;
                const rawKey = data.video_data.keys && data.video_data.keys[0];

                if (!rawManifestUrl) {
                    throw new Error('Video manifest URL is missing inside video_data.');
                }

                if (!rawKey) {
                    throw new Error('DRM keys array is empty or missing inside video_data.');
                }

                updateStatus('Step 5: Setting up Shaka Player instance and DRM configuration...');
                const video = document.getElementById('videoPlayer');
                const player = new shaka.Player(video);

                player.addEventListener('error', (event) => {
                    const errCode = event.detail ? event.detail.code : 'Unknown Code';
                    const errCategory = event.detail ? event.detail.category : 'Unknown Category';
                    updateStatus(`Shaka Player Error Triggered! Code: ${errCode}, Category: ${errCategory}`, true);
                });

                const [keyId, key] = rawKey.split(':');
                if (!keyId || !key) {
                    throw new Error(`Invalid DRM key format received: "${rawKey}"`);
                }

                player.configure({
                    drm: {
                        clearKeys: {
                            [keyId]: key
                        }
                    }
                });

                updateStatus('Step 6: Loading video manifest into player...');
                await player.load(rawManifestUrl);
                updateStatus('Success: Video is loaded and playing successfully!');

            } catch (e) {
                updateStatus(`Critical Error Caught: ${e.message || e}`, true);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
