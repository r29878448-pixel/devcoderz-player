<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shaka Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <script>
        async function initApp() {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                console.error('Browser not supported!');
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const batchId = urlParams.get('batchId');
            const subjectId = urlParams.get('subjectId');
            const scheduleId = urlParams.get('scheduleId');

            if (!batchId || !subjectId || !scheduleId) {
                console.error('Missing URL parameters!');
                return;
            }

            const timestamp = new Date().getTime();
            const apiUrl = `https://brainboxinstitute.in/api/video-url?batchId=${batchId}&subjectId=${subjectId}&scheduleId=${scheduleId}&t=${timestamp}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.success || !data.video_data) {
                    console.error('Invalid API response');
                    return;
                }

                const manifestUri = data.video_data.url;
                const rawKey = data.video_data.keys[0];

                const video = document.getElementById('videoPlayer');
                const player = new shaka.Player(video);

                player.addEventListener('error', (event) => {
                    console.error('Error code', event.detail.code, event.detail);
                });

                const [keyId, key] = rawKey.split(':');
                player.configure({
                    drm: {
                        clearKeys: {
                            [keyId]: key
                        }
                    }
                });

                await player.load(manifestUri);
                console.log('Video loaded successfully!');
            } catch (e) {
                console.error('Error loading video data', e);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
