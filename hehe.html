<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shaka Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #status-box {
            color: #00ffcc;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
            max-width: 800px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="videoPlayer" controls autoplay></video>
        <div id="status-box">Initializing player...</div>
    </div>

    <script>
        const statusBox = document.getElementById('status-box');

        function updateStatus(message, isError = false) {
            console.log(message);
            statusBox.style.color = isError ? '#ff4444' : '#00ffcc';
            statusBox.innerText = message;
        }

        async function initApp() {
            try {
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    updateStatus('Error: Browser not supported!', true);
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const batchId = urlParams.get('batchId');
                const subjectId = urlParams.get('subjectId');
                const scheduleId = urlParams.get('scheduleId');

                if (!batchId || !subjectId || !scheduleId) {
                    updateStatus('Error: Missing URL parameters (batchId, subjectId, scheduleId)', true);
                    return;
                }

                updateStatus('Fetching video details from API...');
                const timestamp = new Date().getTime();
                const apiUrl = `https://brainboxinstitute.in/api/video-url?batchId=${batchId}&subjectId=${subjectId}&scheduleId=${scheduleId}&t=${timestamp}`;

                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`API HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                if (!data.success || !data.video_data) {
                    throw new Error('Invalid API response structure');
                }

                const rawManifestUrl = data.video_data.url;
                const rawKey = data.video_data.keys && data.video_data.keys[0];

                if (!rawManifestUrl || !rawKey) {
                    throw new Error('Manifest URL or DRM keys missing');
                }

                // URL ko aapke bataye hue custom format me convert karna
                let finalManifestUri = rawManifestUrl;
                const match = rawManifestUrl.match(/\.net\/([^/]+)\/master\.mpd/);
                if (match && match[1]) {
                    const fileHash = match[1];
                    const queryParams = rawManifestUrl.split('?')[1];
                    finalManifestUri = `https://hls.brainboxinstitute.in/play/${fileHash}/dash/audio/6.mp4?${queryParams}`;
                }

                updateStatus(`Transformed URL: ${finalManifestUri}`);

                const video = document.getElementById('videoPlayer');
                const player = new shaka.Player(video);

                player.addEventListener('error', (event) => {
                    updateStatus(`Shaka Error Code: ${event.detail.code}, Category: ${event.detail.category}`, true);
                });

                const [keyId, key] = rawKey.split(':');
                player.configure({
                    drm: {
                        clearKeys: {
                            [keyId]: key
                        }
                    }
                });

                await player.load(finalManifestUri);
                updateStatus('Success: Video loaded and playing!');
            } catch (e) {
                updateStatus(`Critical Error: ${e.message}`, true);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
