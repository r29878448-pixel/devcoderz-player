<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Shaka Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #error-msg {
            color: #ff4444;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="videoPlayer" controls autoplay></video>
        <div id="error-msg"></div>
    </div>

    <script>
        const errorBox = document.getElementById('error-msg');

        function showError(msg) {
            console.error(msg);
            errorBox.innerText = msg;
        }

        async function initApp() {
            try {
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    showError('Browser not supported!');
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const batchId = urlParams.get('batchId');
                const subjectId = urlParams.get('subjectId');
                const scheduleId = urlParams.get('scheduleId');

                if (!batchId || !subjectId || !scheduleId) {
                    showError('Missing URL parameters! Add batchId, subjectId, and scheduleId.');
                    return;
                }

                const timestamp = new Date().getTime();
                const apiUrl = `https://brainboxinstitute.in/api/video-url?batchId=${batchId}&subjectId=${subjectId}&scheduleId=${scheduleId}&t=${timestamp}`;

                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`API HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                if (!data.success || !data.video_data) {
                    showError('Invalid API response data!');
                    return;
                }

                const rawManifestUrl = data.video_data.url;
                const rawKey = data.video_data.keys[0];

                if (!rawManifestUrl || !rawKey) {
                    showError('Stream URL or DRM keys missing in response!');
                    return;
                }

                const modifiedManifestUri = rawManifestUrl.replace(/\/master\.mpd\?/, '/dash/audio/6.mp4?');

                const video = document.getElementById('videoPlayer');
                const player = new shaka.Player(video);

                player.addEventListener('error', (event) => {
                    showError(`Shaka Player Error: Code ${event.detail.code}`);
                });

                const [keyId, key] = rawKey.split(':');
                player.configure({
                    drm: {
                        clearKeys: {
                            [keyId]: key
                        }
                    }
                });

                await player.load(modifiedManifestUri);
                console.log('Video loaded successfully!');
            } catch (e) {
                showError(`Failed to load: ${e.message}`);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
