<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderz Ultra Smooth Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
.player{position:fixed;inset:0;background:#000;pointer-events:auto}
video{width:100%;height:100%;object-fit:contain}
#status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#00e5ff;font-size:14px;z-index:1000;text-align:center;pointer-events:none;text-shadow:0 0 5px #000}
.top-brand{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none}
.jsr{color:#ff9800;font-weight:700;font-size:14px}
.dev{margin-top:4px;font-size:12px;font-weight:600;color:#00e5ff;text-shadow:0 0 6px #00e5ff}
.center-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:999;cursor:pointer}
.center-play.hide{display:none}
.center-play span{width:90px;height:90px;background:rgba(255,255,255,.25);backdrop-filter:blur(5px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.controls{position:absolute;bottom:0;width:100%;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.9));transition:.1s;z-index:35}
.controls.hide{opacity:0;pointer-events:none}
.progress{height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative;margin-bottom:10px}
.progress-bg{height:7px;width:100%;background:#555;border-radius:10px}
.progress-fill{height:100%;width:0;background:#2196f3;border-radius:10px;will-change:width}
.thumb{position:absolute;top:50%;width:18px;height:18px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);left:0;pointer-events:none;will-change:left}
.time{color:#fff;font-size:11px;margin-bottom:4px;text-align:right}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between;color:#fff}
.btn{width:40px;height:40px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
.settings{position:absolute;bottom:70px;right:10px;background:#111;border-radius:12px;padding:12px;width:150px;display:none;z-index:50}
.settings label{color:#aaa;font-size:10px;display:block;margin-bottom:4px}
.settings select{width:100%;background:#000;color:#fff;border:1px solid #555;border-radius:4px;height:24px;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000}
.box{width:320px;padding:26px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff}
.tg-btn{display:block;margin-top:14px;padding:14px;border-radius:28px;font-weight:700;width:100%;cursor:pointer;text-align:center;text-decoration:none;color:#fff;background:#fff;color:#1e3c72}
.continue{background:rgba(0,0,0,.25);border:1px solid #fff;color:#fff;margin-top:10px}
</style>
</head>
<body>
<div id="status">Ready</div>
<div class="overlay" id="tgPopup">
 <div class="box">
  <h2>Join our Telegram</h2>
  <a class="tg-btn" href="https://t.me/+JXdxtVzQf-NhM2Jl" target="_blank">Join Telegram</a>
  <div class="tg-btn continue" id="continueBtn">Continue to Video</div>
 </div>
</div>
<div class="player" id="player">
 <video id="video" playsinline></video>
 <div class="top-brand"><div class="jsr">🚩 Jai Shree Ram 🚩</div><div class="dev">Developed by - Devansh Sharma</div></div>
 <div class="center-play" id="centerPlay"><span>▶</span></div>
 <div class="controls hide" id="controls">
  <div class="progress" id="progress"><div class="progress-bg"><div class="progress-fill" id="bar"></div></div><div class="thumb" id="thumb"></div></div>
  <div class="time" id="time">00:00:00 / 00:00:00</div>
  <div class="row">
   <div class="btn" id="back">⟲10</div><div class="btn" id="play">▶</div><div class="btn" id="fwd">10⟳</div>
   <div class="btn" id="settingsBtn">⚙️</div><div class="btn" id="fs">⛶</div>
  </div>
 </div>
 <div class="settings" id="settings">
  <label>Speed</label>
  <select id="speed"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="1.75">1.75x</option><option value="2">2x</option><option value="2.25">2.25x</option><option value="2.5">2.5x</option><option value="2.75">2.75x</option><option value="3">3x</option><option value="4">4x</option></select>
  <label>Quality</label><select id="quality"><option value="-1">Auto</option></select>
 </div>
</div>
<script>
let video=document.getElementById("video"),playerDiv=document.getElementById("player"),statusDiv=document.getElementById("status"),shakaPlayer,hideTimer,isDragging=false;
video.preservesPitch=true;
shakaPlayer=new shaka.Player(video);
shakaPlayer.configure({
 streaming:{rebufferingGoal:2,bufferBehind:30,alwaysStreamAllChannels:true},
 drm:{retryParameters:{maxAttempts:2}}
});

async function init(){
 statusDiv.textContent="Fetching...";
 const p=new URLSearchParams(location.search);
 const res=await fetch(`https://api.pimaxer.in/v1/videos/video-url-details?parentId=${p.get('batchId')}&childId=${p.get('lectureId')}`);
 const data=await res.json();

 const masterUrl=data.data.url;
 const drmData=data.data.drmDetails.data; // format: "keyId:keyValue"
 const [kidHex, keyHex]=drmData.split(":");

 // Direct hex mapping without base64 conversion for robust ClearKey support
 const clearKeysObj = {};
 clearKeysObj[kidHex.trim()] = keyHex.trim();

 shakaPlayer.configure({
  drm:{
   clearKeys: clearKeysObj
  }
 });

 statusDiv.textContent="Loading...";
 await shakaPlayer.load(masterUrl);
 shakaPlayer.getVariantTracks().filter(t=>t.height).forEach(t=>{let o=document.createElement("option");o.value=t.id;o.text=t.height+"p";document.getElementById("quality").appendChild(o);});
 statusDiv.style.display="none";
}

function show(){document.getElementById("controls").classList.remove("hide");clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.getElementById("controls").classList.add("hide"),3000);}
document.getElementById("continueBtn").onclick=e=>{document.getElementById("tgPopup").style.display="none";init();};

function updateProgressUI(percent, currentTimeVal) {
 requestAnimationFrame(()=>{
  document.getElementById("bar").style.width=percent+"%";
  document.getElementById("thumb").style.left=percent+"%";
  document.getElementById("time").textContent=fmt(currentTimeVal)+" / "+fmt(video.duration || 0);
 });
}

video.ontimeupdate=()=>{
 if(!isDragging && video.duration){
  let p=(video.currentTime/video.duration)*100||0;
  updateProgressUI(p, video.currentTime);
 }
};

function fmt(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);return [h,m,sec].map(v=>(v<10?"0"+v:v)).join(":");}

const seek=(e)=>{
 let rect=document.getElementById("progress").getBoundingClientRect();
 let clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
 let pos=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
 if(video.duration){
  let currentTimeVal = pos * video.duration;
  updateProgressUI(pos * 100, currentTimeVal);
  video.currentTime = currentTimeVal;
 }
};

const progressEl = document.getElementById("progress");
progressEl.addEventListener("pointerdown",e=>{isDragging=true; progressEl.setPointerCapture(e.pointerId); seek(e);});
progressEl.addEventListener("pointermove",e=>{if(isDragging) seek(e);});
progressEl.addEventListener("pointerup",e=>{if(isDragging){isDragging=false; try{progressEl.releasePointerCapture(e.pointerId);}catch(err){}}});
progressEl.addEventListener("pointercancel",e=>{if(isDragging){isDragging=false; try{progressEl.releasePointerCapture(e.pointerId);}catch(err){}}});

document.getElementById("play").onclick=()=>video.paused?video.play():video.pause();
document.getElementById("back").onclick=()=>video.currentTime-=10;
document.getElementById("fwd").onclick=()=>video.currentTime+=10;
document.getElementById("settingsBtn").onclick=e=>{e.stopPropagation();document.getElementById("settings").style.display=document.getElementById("settings").style.display==="block"?"none":"block";};
document.getElementById("speed").onchange=e=>{video.playbackRate=e.target.value;};
document.getElementById("quality").onchange=e=>shakaPlayer.selectVariantTrack(shakaPlayer.getVariantTracks().find(t=>t.id==e.target.value),true);
document.getElementById("fs").onclick=()=>!document.fullscreenElement?playerDiv.requestFullscreen():document.exitFullscreen();
document.getElementById("centerPlay").onpointerdown=e=>{e.stopPropagation();video.play();document.getElementById("centerPlay").classList.add("hide");show();};
playerDiv.onclick=e=>{if(e.target==video||e.target.id=="player"){show();document.getElementById("settings").style.display="none";}};
video.onplay=()=>document.getElementById("play").textContent="❚❚";
video.onpause=()=>document.getElementById("play").textContent="▶";
</script>
</body>
</html>
